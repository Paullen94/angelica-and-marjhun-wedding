ref\") || \"\";\n    const fileName = rawHref.split(/[?#]/)[0].split(\"/\").pop();\n    if (knownPages[fileName]) {\n      event.preventDefault();\n      parent.postMessage({ type: \"wedding-page-navigation\", page: knownPages[fileName] }, \"*\");\n    }\n  }, true);\n})();\n\u003c/script>\n\n\u003c/body>\n\n\u003c/html>\n", "details": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\n\u003ctitle>Jelai &amp; Jhun | Wedding Details\u003c/title>\n\n\u003cstyle>\n:root {\n    /* Wedding colors */\n    --lavender: #B8A9D9;\n    --lilac: #C9B7E8;\n    --blush-pink: #E8B7C8;\n    --powder-blue: #AFCFE3;\n    --ivory: #FFF8E7;\n\n    /* Typography */\n    --deep-lavender: #75618E;\n    --mauve-plum: #59465F;\n    --muted-lavender: #806B9B;\n\n    /* Principal Sponsors: cream and ivory palette */\n    --sponsor-cream-1: #F5E7B2;\n    --sponsor-cream-2: #F8EFC4;\n    --sponsor-cream-3: #FFFBD1;\n    --sponsor-cream-4: #FFFEF0;\n    --sponsor-cream-5: #D5CCA6;\n}\n\n* {\n    box-sizing: border-box;\n}\n\nhtml {\n    scroll-behavior: smooth;\n}\n\nbody {\n    margin: 0;\n    padding: 0;\n    font-family: Georgia, \"Times New Roman\", serif;\n    color: var(--mauve-plum);\n    background-color: var(--ivory);\n    background-image: url(\"./opening-background.png\");\n    background-position: center top;\n    background-size: 100% auto;\n    background-repeat: repeat-y;\n    overflow-x: hidden;\n}\n\nimg {\n    max-width: 100%;\n}\n\na {\n    text-decoration: none;\n}\n\n.details-page {\n    width: 100%;\n    min-height: 100vh;\n    overflow: hidden;\n}\n\n.details-content {\n    width: 100%;\n    max-width: 1180px;\n    margin: 0 auto;\n    padding: 0 28px 80px;\n}\n\n/* =====================================================\n   COUPLE PHOTO — FULL WIDTH\n===================================================== */\n\n.couple-banner {\n    width: 100vw;\n    margin-left: calc(50% - 50vw);\n    margin-right: calc(50% - 50vw);\n    overflow: hidden;\n}\n\n.couple-banner img {\n    display: block;\n    width: 100vw;\n    max-width: none;\n    height: auto;\n    margin: 0;\n}\n\n/* =====================================================\n   MUSIC\n===================================================== */\n\n.music-area {\n    text-align: center;\n    margin: 28px 0 20px;\n}\n\n.music-button {\n    display: inline-flex;\n    align-items: center;\n    justify-content: center;\n    width: 58px;\n    height: 58px;\n    border-radius: 50%;\n    border: 1px solid var(--lavender);\n    background: rgba(255, 255, 255, 0.8);\n    color: var(--deep-lavender);\n    font-size: 22px;\n    cursor: pointer;\n    box-shadow: 0 4px 14px rgba(89, 70, 95, 0.12);\n    transition: transform 0.3s ease;\n}\n\n.music-button:hover {\n    transform: scale(1.06);\n}\n\n/* =====================================================\n   COUNTDOWN\n===================================================== */\n\n.countdown-section {\n    text-align: center;\n    margin: 12px auto 50px;\n}\n\n.countdown-title {\n    margin: 0 0 18px;\n    font-size: 24px;\n    letter-spacing: 2px;\n    color: var(--deep-lavender);\n}\n\n.countdown {\n    display: flex;\n    justify-content: center;\n    align-items: center;\n    flex-wrap: wrap;\n    gap: 14px;\n}\n\n.countdown-box {\n    min-width: 78px;\n    padding: 13px 10px;\n    border-radius: 12px;\n    background: rgba(255, 255, 255, 0.72);\n    border: 1px solid rgba(184, 169, 217, 0.6);\n}\n\n.countdown-number {\n    display: block;\n    font-size: 27px;\n    font-weight: bold;\n    color: var(--mauve-plum);\n}\n\n.countdown-label {\n    display: block;\n    margin-top: 4px;\n    font-size: 11px;\n    letter-spacing: 1.2px;\n    text-transform: uppercase;\n    color: var(--muted-lavender);\n}\n\n/* =====================================================\n   GENERAL SECTIONS\n===================================================== */\n\n.section {\n    margin: 65px auto;\n    text-align: center;\n}\n\n.section-title {\n    margin: 0 0 28px;\n    font-size: 38px;\n    line-height: 1.2;\n    letter-spacing: 1.5px;\n    color: var(--deep-lavender);\n    font-weight: 500;\n}\n\n/* =====================================================\n   CEREMONY AND RECEPTION\n===================================================== */\n\n.venue-card {\n    max-width: 760px;\n    margin: 32px auto;\n    text-align: center;\n}\n\n.venue-card img {\n    display: block;\n    width: 100%;\n    max-width: 650px;\n    height: auto;\n    margin: 0 auto 20px;\n    background: transparent;\n    border: none;\n    box-shadow: none;\n}\n\n.venue-name {\n    margin: 8px 0;\n    font-size: 27px;\n    color: var(--mauve-plum);\n}\n\n.venue-address {\n    max-width: 700px;\n    margin: 0 auto;\n    font-size: 19px;\n    line-height: 1.6;\n    color: var(--mauve-plum);\n}\n\n/* =====================================================\n   ENTOURAGE\n===================================================== */\n\n.entourage-section {\n    text-align: center;\n}\n\n.entourage-group {\n    max-width: 900px;\n    margin: 45px auto;\n}\n\n.entourage-group-title {\n    margin-bottom: 22px;\n    font-size: 25px;\n    color: var(--deep-lavender);\n    letter-spacing: 1px;\n    text-transform: uppercase;\n}\n\n.entourage-list {\n    margin: 0 auto;\n    padding: 0;\n    list-style: none;\n}\n\n.entourage-list li {\n    margin: 8px 0;\n    font-size: 18px;\n    line-height: 1.5;\n    color: var(--mauve-plum);\n}\n\n.entourage-role {\n    font-weight: bold;\n    color: var(--muted-lavender);\n}\n\n/* =====================================================\n   BRIDE'S BANNER\n===================================================== */\n\n.brides-banner {\n    margin: 55px auto 10px;\n    text-align: center;\n}\n\n.brides-banner-title {\n    margin-bottom: 22px;\n    font-size: 28px;\n    color: var(--deep-lavender);\n    letter-spacing: 1px;\n}\n\n.brides-banner-name {\n    margin-top: 18px;\n    font-size: 22px;\n    color: var(--mauve-plum);\n}\n\n/* =====================================================\n   ATTIRE\n===================================================== */\n\n.attire-section {\n    margin-top: 45px;\n    text-align: center;\n}\n\n.attire-main-caption {\n    max-width: 900px;\n    margin: 0 auto 48px;\n    font-size: 23px;\n    line-height: 1.55;\n    color: var(--mauve-plum);\n}\n\n.attire-group {\n    width: 100%;\n    max-width: 1050px;\n    margin: 0 auto 75px;\n    text-align: center;\n}\n\n.attire-group-title {\n    margin: 0 0 25px;\n    font-size: 32px;\n    line-height: 1.25;\n    color: var(--deep-lavender);\n    letter-spacing: 1px;\n    font-weight: 500;\n}\n\n.attire-image {\n    display: block;\n    width: 100%;\n    max-width: 1050px;\n    height: auto;\n    margin: 0 auto;\n    padding: 0;\n    background: transparent !important;\n    border: none !important;\n    box-shadow: none !important;\n    border-radius: 0 !important;\n    mix-blend-mode: normal;\n}\n\n/* =====================================================\n   ATTIRE COLOR PALETTES\n===================================================== */\n\n.color-palette {\n    display: flex;\n    justify-content: center;\n    align-items: center;\n    flex-wrap: wrap;\n    gap: 12px;\n    margin: 25px auto 0;\n    padding: 0;\n}\n\n.color-circle {\n    display: block;\n    flex: 0 0 auto;\n    width: 72px;\n    height: 72px;\n    border-radius: 50%;\n    border: none;\n    box-shadow: none;\n}\n\n/* Principal Sponsors — cream and ivory tones */\n\n.principal-palette .color-circle:nth-child(1) {\n    background: var(--sponsor-cream-1);\n}\n\n.principal-palette .color-circle:nth-child(2) {\n    background: var(--sponsor-cream-2);\n}\n\n.principal-palette .color-circle:nth-child(3) {\n    background: var(--sponsor-cream-3);\n}\n\n.principal-palette .color-circle:nth-child(4) {\n    background: var(--sponsor-cream-4);\n    border: 1px solid #E7E1CD;\n}\n\n.principal-palette .color-circle:nth-child(5) {\n    background: var(--sponsor-cream-5);\n}\n\n/* Entourage — 4 wedding colors */\n\n.entourage-palette .color-circle:nth-child(1) {\n    background: var(--lavender);\n}\n\n.entourage-palette .color-circle:nth-child(2) {\n    background: var(--lilac);\n}\n\n.entourage-palette .color-circle:nth-child(3) {\n    background: var(--blush-pink);\n}\n\n.entourage-palette .color-circle:nth-child(4) {\n    background: var(--powder-blue);\n}\n\n/* Guests — all 5 wedding colors */\n\n.guest-palette .color-circle:nth-child(1) {\n    background: var(--lavender);\n}\n\n.guest-palette .color-circle:nth-child(2) {\n    background: var(--lilac);\n}\n\n.guest-palette .color-circle:nth-child(3) {\n    background: var(--blush-pink);\n}\n\n.guest-palette .color-circle:nth-child(4) {\n    background: var(--powder-blue);\n}\n\n.guest-palette .color-circle:nth-child(5) {\n    background: var(--ivory);\n    border: 1px solid #D8CCB8;\n}\n\n/* =====================================================\n   PRINCIPAL SPONSORS ATTIRE INSTRUCTIONS\n===================================================== */\n\n.principal-attire-note {\n    max-width: 850px;\n    margin: 25px auto 0;\n    font-size: 20px;\n    line-height: 1.8;\n    color: var(--mauve-plum);\n}\n\n.principal-attire-note strong {\n    color: var(--deep-lavender);\n}\n\n/* =====================================================\n   ATTIRE NOTICE\n===================================================== */\n\n.attire-notice {\n    max-width: 850px;\n    margin: 5px auto 45px;\n    padding: 20px 24px;\n    border-top: 1px solid rgba(117, 97, 142, 0.35);\n    border-bottom: 1px solid rgba(117, 97, 142, 0.35);\n    font-size: 18px;\n    line-height: 1.6;\n    color: var(--mauve-plum);\n}\n\n/* =====================================================\n   IN LIEU OF GIFTS — BANK QR CODES\n===================================================== */\n\n.gifts-section {\n    max-width: 950px;\n    margin: 80px auto;\n    text-align: center;\n}\n\n.gifts-section > img.gifts-illustration {\n    display: block;\n    width: 100%;\n    max-width: 300px;\n    height: auto;\n    margin: 0 auto 25px;\n    background: transparent;\n    border: none;\n    box-shadow: none;\n}\n\n.gifts-title {\n    margin-bottom: 18px;\n    font-size: 32px;\n    color: var(--deep-lavender);\n}\n\n.gifts-text {\n    max-width: 850px;\n    margin: 0 auto 32px;\n    font-size: 20px;\n    line-height: 1.7;\n    color: var(--mauve-plum);\n}\n\n/* QR code layout */\n\n.bank-qr-container {\n    display: flex;\n    justify-content: center;\n    align-items: flex-start;\n    flex-wrap: wrap;\n    gap: 32px;\n    margin: 35px auto 0;\n}\n\n.bank-qr-card {\n    width: 100%;\n    max-width: 280px;\n    padding: 20px;\n    background: rgba(255, 255, 255, 0.76);\n    border: 1px solid rgba(184, 169, 217, 0.55);\n    border-radius: 18px;\n    box-shadow: 0 5px 18px rgba(89, 70, 95, 0.08);\n}\n\n.bank-qr-card img {\n    display: block;\n    width: 100%;\n    max-width: 240px;\n    height: auto;\n    margin: 0 auto;\n    object-fit: contain;\n    background: #FFFFFF;\n}\n\n.bank-qr-label {\n    margin: 14px 0 0;\n    font-size: 16px;\n    line-height: 1.5;\n    color: var(--mauve-plum);\n}\n\n/* =====================================================\n   OH SNAP — OFFICIAL HASHTAG\n===================================================== */\n\n.oh-snap-section {\n    margin: 80px auto 70px;\n    text-align: center;\n}\n\n.oh-snap-section img {\n    display: block;\n    width: 100%;\n    max-width: 260px;\n    height: auto;\n    margin: 0 auto 20px;\n    background: transparent;\n    border: none;\n    box-shadow: none;\n}\n\n.oh-snap-title {\n    margin: 0 0 14px;\n    font-size: 35px;\n    color: var(--deep-lavender);\n}\n\n.hashtag-instruction {\n    margin: 0 auto 14px;\n    font-size: 17px;\n    line-height: 1.6;\n    letter-spacing: 1px;\n    font-weight: bold;\n    color: var(--deep-lavender);\n}\n\n.hashtag {\n    margin: 0 auto;\n    font-size: 23px;\n    font-weight: bold;\n    color: var(--mauve-plum);\n    overflow-wrap: anywhere;\n}\n\n/* =====================================================\n   BACK BUTTON\n===================================================== */\n\n.back-area {\n    margin: 70px auto 35px;\n    text-align: center;\n}\n\n.back-button {\n    display: inline-flex;\n    align-items: center;\n    justify-content: center;\n    min-width: 150px;\n    padding: 15px 30px;\n    border-radius: 30px;\n    border: 1px solid var(--lavender);\n    background: rgba(255, 255, 255, 0.72);\n    color: var(--mauve-plum);\n    font-size: 16px;\n    letter-spacing: 2px;\n    transition: all 0.3s ease;\n}\n\n.back-button:hover {\n    background: var(--deep-lavender);\n    color: #FFFFFF;\n}\n\n/* =====================================================\n   FADE-IN\n===================================================== */\n\n.fade-in {\n    opacity: 0;\n    transform: translateY(20px);\n    transition: opacity 0.9s ease, transform 0.9s ease;\n}\n\n.fade-in.visible {\n    opacity: 1;\n    transform: translateY(0);\n}\n\n/* =====================================================\n   DESKTOP\n===================================================== */\n\n@media (min-width: 1200px) {\n    .details-content {\n        padding-left: 45px;\n        padding-right: 45px;\n    }\n\n    .attire-group {\n        max-width: 1100px;\n    }\n\n    .section-title {\n        font-size: 42px;\n    }\n\n    .color-circle {\n        width: 76px;\n        height: 76px;\n    }\n}\n\n/* =====================================================\n   TABLET\n===================================================== */\n\n@media (max-width: 900px) {\n    .details-content {\n        padding-left: 20px;\n        padding-right: 20px;\n    }\n\n    .section {\n        margin: 50px auto;\n    }\n\n    .section-title {\n        font-size: 34px;\n    }\n\n    .attire-group-title {\n        font-size: 29px;\n    }\n\n    .attire-main-caption {\n        font-size: 21px;\n    }\n\n    .color-circle {\n        width: 65px;\n        height: 65px;\n    }\n\n    .bank-qr-card {\n        max-width: 260px;\n    }\n}\n\n/* =====================================================\n   MOBILE\n===================================================== */\n\n@media (max-width: 600px) {\n    body {\n        background-size: auto 100%;\n        background-attachment: scroll;\n    }\n\n    .details-content {\n        padding-left: 14px;\n        padding-right: 14px;\n        padding-bottom: 50px;\n    }\n\n    .music-area {\n        margin-top: 20px;\n    }\n\n    .music-button {\n        width: 52px;\n        height: 52px;\n        font-size: 19px;\n    }\n\n    .countdown-section {\n        margin-bottom: 35px;\n    }\n\n    .countdown-title {\n        font-size: 18px;\n    }\n\n    .countdown {\n        gap: 7px;\n    }\n\n    .countdown-box {\n        min-width: 68px;\n        padding: 10px 7px;\n    }\n\n    .countdown-number {\n        font-size: 22px;\n    }\n\n    .countdown-label {\n        font-size: 9px;\n    }\n\n    .section {\n        margin: 42px auto;\n    }\n\n    .section-title {\n        font-size: 29px;\n        letter-spacing: 1px;\n    }\n\n    .venue-name {\n        font-size: 22px;\n    }\n\n    .venue-address {\n        font-size: 16px;\n    }\n\n    .entourage-group {\n        margin: 35px auto;\n    }\n\n    .entourage-group-title {\n        font-size: 21px;\n    }\n\n    .entourage-list li {\n        font-size: 16px;\n    }\n\n    .brides-banner-title {\n        font-size: 23px;\n    }\n\n    .brides-banner-name {\n        font-size: 19px;\n    }\n\n    .attire-main-caption {\n        font-size: 18px;\n        line-height: 1.55;\n        margin-bottom: 38px;\n    }\n\n    .attire-group {\n        margin-bottom: 55px;\n    }\n\n    .attire-group-title {\n        font-size: 25px;\n        margin-bottom: 18px;\n    }\n\n    .attire-image {\n        width: 100%;\n        max-width: 100%;\n    }\n\n    .color-palette {\n        gap: 8px;\n        margin-top: 18px;\n    }\n\n    .color-circle {\n        width: 48px;\n        height: 48px;\n    }\n\n    .principal-attire-note {\n        font-size: 17px;\n    }\n\n    .attire-notice {\n        font-size: 16px;\n        padding: 17px;\n    }\n\n    .gifts-title {\n        font-size: 27px;\n    }\n\n    .gifts-text {\n        font-size: 17px;\n    }\n\n    .bank-qr-container {\n        gap: 22px;\n    }\n\n    .bank-qr-card {\n        max-width: 290px;\n        padding: 16px;\n    }\n\n    .bank-qr-card img {\n        max-width: 240px;\n    }\n\n    .oh-snap-title {\n        font-size: 29px;\n    }\n\n    .hashtag-instruction {\n        font-size: 14px;\n    }\n\n    .hashtag {\n        font-size: 18px;\n    }\n\n    .back-button {\n        min-width: 130px;\n        padding: 13px 25px;\n    }\n}\n\u003c/style>\n\u003c/head>\n\n\u003cbody>\n\n\u003cdiv class=\"details-page\">\n\u003cdiv class=\"details-content\">\n\n\u003c!-- =====================================================\n     COUPLE PHOTO\n===================================================== -->\n\n\u003csection class=\"couple-banner fade-in\">\n    \u003cimg src=\"./couple.jpg\" alt=\"Jelai and Jhun\">\n\u003c/section>\n\n\u003c!-- =====================================================\n     MUSIC\n===================================================== -->\n\n\u003csection class=\"music-area fade-in\">\n    \u003cbutton\n        class=\"music-button\"\n        id=\"musicButton\"\n        type=\"button\"\n        aria-label=\"Play wedding music\"\n    >♪\u003c/button>\n\n    \u003caudio id=\"weddingMusic\" loop>\n        \u003csource src=\"./wedding-music.mp3\" type=\"audio/mpeg\">\n    \u003c/audio>\n\u003c/section>\n\n\u003c!-- =====================================================\n     COUNTDOWN\n===================================================== -->\n\n\u003csection class=\"countdown-section fade-in\">\n\n    \u003ch2 class=     >\n\n        \u003cp class=\"principal-attire-note\">\n            \u003cstrong>Gentlemen:\u003c/strong> Barong\n            \u003cbr>\n            \u003cstrong>Ladies:\u003c/strong> Long Gown\n        \u003c/p>\n\n        \u003cdiv class=\"color-palette principal-palette\">\n            \u003cspan class=\"color-circle\" title=\"Cream\">\u003c/span>\n            \u003cspan class=\"color-circle\" title=\"Light Cream\">\u003c/span>\n            \u003cspan class=\"color-circle\" title=\"Pale Ivory\">\u003c/span>\n            \u003cspan class=\"color-circle\" title=\"Ivory White\">\u003c/span>\n            \u003cspan class=\"color-circle\" title=\"Warm Beige\">\u003c/span>\n        \u003c/div>\n\n    \u003c/div>\n\n    \u003c!-- ENTOURAGE -->\n\n    \u003cdiv class=\"attire-group\">\n\n        \u003ch3 class=\"attire-group-title\">ENTOURAGE\u003c/h3>\n\n        \u003cimg\n            src=\"./entourage.png\"\n            alt=\"Entourage Attire\"\n            class=\"attire-image\"\n        >\n\n        \u003cdiv class=\"color-palette entourage-palette\">\n            \u003cspan class=\"color-circle\" title=\"Lavender\">\u003c/span>\n            \u003cspan class=\"color-circle\" title=\"Lilac\">\u003c/span>\n            \u003cspan class=\"color-circle\" title=\"Blush Pink\">\u003c/span>\n            \u003cspan class=\"color-circle\" title=\"Powder Blue\">\u003c/span>\n        \u003c/div>\n\n    \u003c/div>\n\n    \u003c!-- GUESTS -->\n\n    \u003cdiv class=\"attire-group\">\n\n        \u003ch3 class=\"attire-group-title\">GUESTS\u003c/h3>\n\n        \u003cimg\n            src=\"./guests.png\"\n            alt=\"Guest Attire\"\n            class=\"attire-image\"\n        >\n\n        \u003cdiv class=\"color-palette guest-palette\">\n            \u003cspan class=\"color-circle\" title=\"Lavender\">\u003c/span>\n            \u003cspan class=\"color-circle\" title=\"Lilac\">\u003c/span>\n            \u003cspan class=\"color-circle\" title=\"Blush Pink\">\u003c/span>\n            \u003cspan class=\"color-circle\" title=\"Powder Blue\">\u003c/span>\n            \u003cspan class=\"color-circle\" title=\"Ivory\">\u003c/span>\n        \u003c/div>\n\n    \u003c/div>\n\n    \u003cdiv class=\"attire-notice\">\n        \u003cstrong>Strictly No Wearing Of The Following:\u003c/strong>\n        \u003cbr>\n        White and black dresses, slippers, and shorts.\n    \u003c/div>\n\n\u003c/section>\n\n\u003c!-- =====================================================\n     IN LIEU OF GIFTS\n===================================================== -->\n\n\u003csection class=\"gifts-section fade-in\">\n\n    \u003cimg\n        src=\"./gifts.png\"\n        alt=\"Wedding Gifts\"\n        class=\"gifts-illustration\"\n    >\n\n    \u003ch2 class=\"gifts-title\">IN LIEU OF GIFTS\u003c/h2>\n\n    \u003cp class=\"gifts-text\">\n        Your presence at our wedding is the greatest gift\n        we could ask for. If you wish to bless us further,\n        a monetary gift will be sincerely appreciated as we\n        begin this new chapter together.\n    \u003c/p>\n\n    \u003cdiv class=\"bank-qr-container\">\n\n        \u003cdiv class=\"bank-qr-card\">\n            \u003cimg\n                src=\"./bank-qr1.jpg\"\n                alt=\"First bank payment QR code\"\n                loading=\"lazy\"\n            >\n            \u003cp class=\"bank-qr-label\">\n                Scan to send your gift\n            \u003c/p>\n        \u003c/div>\n\n        \u003cdiv class=\"bank-qr-card\">\n            \u003cimg\n                src=\"./bank-qr2.jpg\"\n                alt=\"Second bank payment QR code\"\n                loading=\"lazy\"\n            >\n            \u003cp class=\"bank-qr-label\">\n                Scan to send your gift\n            \u003c/p>\n        \u003c/div>\n\n    \u003c/div>\n\n\u003c/section>\n\n\u003c!-- =====================================================\n     OH SNAP\n===================================================== -->\n\n\u003csection class=\"oh-snap-section fade-in\">\n\n    \u003cimg src=\"./camera.png\" alt=\"Wedding Camera\">\n\n    \u003ch2 class=\"oh-snap-title\">OH SNAP!\u003c/h2>\n\n    \u003cp class=\"hashtag-instruction\">\n        PLEASE USE OUR OFFICIAL WEDDING HASHTAG\n    \u003c/p>\n\n    \u003cdiv class=\"hashtag\">\n        #JELAIfoundherJHUNuineLOVE\n    \u003c/div>\n\n\u003c/section>\n\n\u003c!-- =====================================================\n     BACK TO INVITATION PAGE\n===================================================== -->\n\n\u003cdiv class=\"back-area fade-in\">\n\n    \u003ca href=\"./inside.html\" class=\"back-button\">\n        BACK\n    \u003c/a>\n\n\u003c/div>\n\n\u003c/div>\n\u003c/div>\n\n\u003cscript>\n/* =====================================================\n   MUSIC BUTTON\n===================================================== */\n\nconst musicButton = document.getElementById(\"musicButton\");\nconst weddingMusic = document.getElementById(\"weddingMusic\");\n\nlet musicPlaying = false;\n\nmusicButton.addEventListener(\"click\", function () {\n    if (musicPlaying) {\n        weddingMusic.pause();\n        musicButton.textContent = \"♪\";\n        musicPlaying = false;\n    } else {\n        weddingMusic.play()\n            .then(function () {\n                musicButton.textContent = \"❚❚\";\n                musicPlaying = true;\n            })\n            .catch(function () {\n                musicButton.textContent = \"♪\";\n            });\n    }\n});\n\nweddingMusic.addEventListener(\"pause\", function () {\n    musicPlaying = false;\n    musicButton.textContent = \"♪\";\n});\n\n/* =====================================================\n   COUNTDOWN — PHILIPPINE TIME\n===================================================== */\n\nconst weddingDate =\n    new Date(\"2026-12-28T15:00:00+08:00\").getTime();\n\nfunction updateCountdown() {\n    const now = Date.now();\n    const distance = weddingDate - now;\n\n    if (distance \u003c= 0) {\n        document.getElementById(\"days\").textContent = \"0\";\n        document.getElementById(\"hours\").textContent = \"0\";\n        document.getElementById(\"minutes\").textContent = \"0\";\n        document.getElementById(\"seconds\").textContent = \"0\";\n        return;\n    }\n\n    const days = Math.floor(\n        distance / (1000 * 60 * 60 * 24)\n    );\n\n    const hours = Math.floor(\n        (distance % (1000 * 60 * 60 * 24)) /\n        (1000 * 60 * 60)\n    );\n\n    const minutes = Math.floor(\n        (distance % (1000 * 60 * 60)) /\n        (1000 * 60)\n    );\n\n    const seconds = Math.floor(\n        (distance % (1000 * 60)) / 1000\n    );\n\n    document.getElementById(\"days\").textContent = days;\n    document.getElementById(\"hours\").textContent = hours;\n    document.getElementById(\"minutes\").textContent = minutes;\n    document.getElementById(\"seconds\").textContent = seconds;\n}\n\nupdateCountdown();\nsetInterval(updateCountdown, 1000);\n\n/* =====================================================\n   FADE-IN ANIMATION\n===================================================== */\n\nconst fadeElements = document.querySelectorAll(\".fade-in\");\n\nif (\"IntersectionObserver\" in window) {\n    const observer = new IntersectionObserver(\n        function (entries) {\n            entries.forEach(function (entry) {\n                if (entry.isIntersecting) {\n                    entry.target.classList.add(\"visible\");\n                    observer.unobserve(entry.target);\n                }\n            });\n        },\n        { threshold: 0.08 }\n    );\n\n    fadeElements.forEach(function (element) {\n        observer.observe(element);\n    });\n} else {\n    fadeElements.forEach(function (element) {\n        element.classList.add(\"visible\");\n    });\n}\n\u003c/script>\n\n\n\u003cscript>\n(function () {\n  const knownPages = {\n    \"index.html\": \"opening\",\n    \"inside.html\": \"invitation\",\n    \"details.html\": \"details\",\n    \"story.html\": \"story\",\n    \"prenup.html\": \"prenup\",\n    \"prenup(1).html\": \"prenup\"\n  };\n  document.addEventListener(\"click\", function (event) {\n    const link = event.target.closest(\"a[href]\");\n    if (!link) return;\n    const rawHref = link.getAttribute(\"href\") || \"\";\n    const fileName = rawHref.split(/[?#]/)[0].split(\"/\").pop();\n    if (knownPages[fileName]) {\n      event.preventDefault();\n      parent.postMessage({ type: \"wedding-page-navigation\", page: knownPages[fileName] }, \"*\");\n    }\n  }, true);\n})();\n\u003c/script>\n\n\u003c/body>\n\u003c/html>", "story": "\n\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Our Story | Jelai &amp; Jhun\u003c/title>\n\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Serif+Display&family=Great+Vibes&family=Montserrat:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n\n\u003cstyle>\n:root {\n  --plum: #512853;\n  --ink: #39283e;\n  --lavender: #79518e;\n  --blush: #bd547a;\n  --ivory: #fffaf3;\n  --paper: #fffdf9;\n  --line: #dfc7df;\n}\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  color: var(--ink);\n  font-family: 'Montserrat', sans-serif;\n  line-height: 1.7;\n  background: var(--ivory);\n}\n\n.page-background {\n  position: fixed;\n  inset: 0;\n  z-index: -1;\n  background: #fff7f2 url(\"./story-background.png\") center center / cover no-repeat;\n}\n\n.page {\n  width: min(1180px, 100%);\n  margin: auto;\n  padding: 20px 24px 45px;\n}\n\n/* NAVIGATION */\n.top-navigation {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  gap: 12px;\n  margin-bottom: 25px;\n}\n\n.nav-button {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  min-height: 44px;\n  padding: 10px 17px;\n  border: 1px solid #c9a9ce;\n  border-radius: 30px;\n  background: #fffdf9;\n  color: var(--plum);\n  text-decoration: none;\n  font-size: 10px;\n  font-weight: 700;\n  letter-spacing: .04em;\n  transition: background .2s ease, color .2s ease;\n}\n\n.nav-button:hover {\n  background: var(--plum);\n  color: white;\n}\n\n.nav-button.primary {\n  background: var(--plum);\n  color: white;\n  border-color: var(--plum);\n}\n\n/* HEADER */\n.hero {\n  text-align: center;\n  padding: 25px 12px 30px;\n}\n\n.eyebrow {\n  display: inline-block;\n  padding: 5px 10px;\n  border-radius: 5px;\n  background: rgba(255,250,243,.96);\n  color: #67416f;\n  font-size: 10px;\n  font-weight: 700;\n  letter-spacing: .17em;\n  text-transform: uppercase;\n}\n\n.hero h1 {\n  margin: 12px 0 0;\n  color: var(--plum);\n  font-family: 'DM Serif Display', serif;\n  font-size: clamp(43px, 8vw, 78px);\n  line-height: 1.15;\n}\n\n.ampersand {\n  color: var(--blush);\n  font-family: 'Great Vibes', cursive;\n}\n\n.script-heading {\n  margin: 0;\n  color: #70427e;\n  font-family: 'Great Vibes', cursive;\n  font-size: clamp(37px, 5vw, 53px);\n  line-height: 1.4;\n}\n\n.hero-date {\n  display: inline-block;\n  margin-top: 14px;\n  padding: 5px 10px;\n  border-radius: 5px;\n  background: rgba(255,250,243,.96);\n  color: #58375e;\n  font-size: 10px;\n  font-weight: 700;\n  letter-spacing: .08em;\n}\n\n.hero-intro,\n.section-heading p,\n.closing p {\n  background: rgba(255,250,243,.96);\n  color: #422c47;\n  font-family: 'Cormorant Garamond', serif;\n  font-size: clamp(21px, 3vw, 28px);\n  font-weight: 600;\n  line-height: 1.55;\n  border-radius: 8px;\n}\n\n.hero-intro {\n  max-width: 720px;\n  margin: 20px auto 0;\n  padding: 12px 18px;\n}\n\n/* ROSE DIVIDERS */\n.rose-divider {\n  display: block;\n  width: min(330px, 78%);\n  height: auto;\n  margin: 22px auto;\n  object-fit: contain;\n  background: transparent;\n}\n\n.rose-divider.large {\n  width: min(400px, 90%);\n}\n\n/* STORY SECTIONS */\n.section {\n  padding: 24px 0 30px;\n}\n\n.section-heading {\n  margin: 0 auto 24px;\n  text-align: center;\n}\n\n.section-heading h2 {\n  margin: 10px 0;\n  color: var(--plum);\n  font-family: 'DM Serif Display', serif;\n  font-size: clamp(30px, 5vw, 45px);\n  line-height: 1.2;\n}\n\n.section-heading p {\n  max-width: 700px;\n  margin: 10px auto 0;\n  padding: 10px 14px;\n}\n\n.story-card {\n  margin-bottom: 28px;\n  padding: clamp(22px, 5vw, 45px);\n  border: 1px solid var(--line);\n  background: rgba(255,253,249,.98);\n  box-shadow: 0 12px 32px rgba(63,35,66,.13);\n}\n\n.story-copy {\n  color: #39283e;\n  font-family: 'Cormorant Garamond', serif;\n  font-size: clamp(21px, 2.6vw, 25px);\n  font-weight: 600;\n  line-height: 1.7;\n}\n\n.story-copy p {\n  margin: 0 0 23px;\n}\n\n.story-copy p:last-child {\n  margin-bottom: 0;\n}\n\n/* PHOTO GALLERY: TWO PHOTOS PER ROW */\n.photo-gallery {\n  display: grid;\n  grid-template-columns: repeat(2, minmax(0, 1fr));\n  align-items: start;\n  gap: 28px;\n  width: 100%;\n  margin: 30px auto 45px;\n}\n\n.polaroid {\n  min-width: 0;\n  padding: 12px 12px 27px;\n  border: 1px solid #e7d6e6;\n  background: #fffdf9;\n  box-shadow: 0 10px 26px rgba(63,35,66,.15);\n}\n\n/* Preserve the entire original photo without cropping. */\n.polaroid-photo {\n  display: block;\n  width: 100%;\n  height: auto;\n  background: #fffaf5;\n  border: 1px solid #eee1eb;\n}\n\n.polaroid-photo img {\n  display: block;\n  width: 100%;\n  height: auto;\n  max-width: 100%;\n  object-fit: contain;\n  object-position: center;\n}\n\n/* SCRIPTURE */\n.verse {\n  margin: 28px 0;\n  padding: 26px 18px;\n  border-top: 1px solid #d8c0dc;\n  border-bottom: 1px solid #d8c0dc;\n  background: linear-gradient(\n    110deg,\n    rgba(246,236,249,.98),\n    rgba(255,239,243,.98),\n    rgba(237,242,250,.98)\n  );\n  color: var(--plum);\n  text-align: center;\n  font-family: 'Cormorant Garamond', serif;\n  font-size: clamp(23px, 3vw, 29px);\n  font-weight: 600;\n  font-style: italic;\n  line-height: 1.5;\n}\n\n.verse span {\n  display: block;\n  margin-top: 8px;\n  font-family: 'Montserrat', sans-serif;\n  font-size: 10px;\n  font-weight: 700;\n  font-style: normal;\n  letter-spacing: .12em;\n}\n\n/* CLOSING */\n.closing {\n  padding: 30px 10px 15px;\n  text-align: center;\n}\n\n.closing p {\n  max-width: 700px;\n  margin: 14px auto 24px;\n  padding: 13px 17px;\n}\n\n.bottom-navigation {\n  display: flex;\n  justify-content: center;\n  flex-wrap: wrap;\n  gap: 12px;\n  margin-top: 25px;\n}\n\n.footer {\n  padding-top: 20px;\n  color: #58375e;\n  font-size: 10px;\n  font-weight: 700;\n  letter-spacing: .12em;\n}\n\n/* MOBILE */\n@media (max-width: 650px) {\n  .page {\n    padding: 12px 12px 30px;\n  }\n\n  .photo-gallery {\n    grid-template-columns: repeat(2, minmax(0, 1fr));\n    gap: 13px;\n    margin: 22px auto 32px;\n  }\n\n  .polaroid {\n    padding: 6px 6px 17px;\n  }\n\n  .top-navigation {\n    gap: 8px;\n  }\n\n  .nav-button {\n    min-height: 40px;\n    padding: 9px 10px;\n    font-size: 8px;\n  }\n\n  .hero {\n    padding: 20px 3px 25px;\n  }\n\n  .hero-intro {\n    padding: 10px;\n  }\n\n  .story-card {\n    padding: 21px 17px;\n  }\n\n  .story-copy {\n    font-size: 21px;\n  }\n\n  .section-heading p {\n    font-size: 21px;\n  }\n\n  .rose-divider {\n    width: 82%;\n  }\n}\n\n@media (max-width: 350px) {\n  .photo-gallery {\n    gap: 8px;\n  }\n\n  .polaroid {\n    padding: 4px 4px 13px;\n  }\n\n  .nav-button {\n    font-size: 7px;\n  }\n}\n\u003c/style>\n\u003c/head>\n\n\u003cbody>\n\u003cdiv class=\"page-background\" aria-hidden=\"true\">\u003c/div>\n\n\u003cmain class=\"page\">\n\n  \u003c!-- CORRECT DESTINATION: CLICKABLE INVITATION HUB -->\n  \u003cnav class=\"top-navigation\" aria-label=\"Wedding navigation\">\n    \u003ca class=\"nav-button\" href=\"inside.html\">\n      ← Back to Invitation\n    \u003c/a>\n    \u003ca class=\"nav-button primary\" href=\"details.html\">\n      The Details →\n    \u003c/a>\n  \u003c/nav>\n\n  \u003cheader class=\"hero\">\n    \u003cdiv class=\"eyebrow\">A Journey Written by God\u003c/div>\n    \u003ch1>Jelai \u003cspan class=\"ampersand\">&amp;\u003c/span> Jhun\u003c/h1>\n    \u003cp class=\"script-heading\">Our Story\u003c/p>\n\n    \u003cdiv class=\"hero-date\">\n      December 28, 2026 · A Promise of Forever\n    \u003c/div>\n\n    \u003cp class=\"hero-intro\">\n      Some stories begin long before we understand their purpose.\n      Ours is a story of unexpected encounters, separate journeys,\n      and the beautiful timing of God.\n    \u003c/p>\n\n    \u003cimg class=\"rose-divider\" src=\"./rose.png\" alt=\"\">\n  \u003c/header>\n\n  \u003csection class=\"section\">\n    \u003cdiv class=\"section-heading\">\n      \u003cdiv class=\"eyebrow\">Chapter One\u003c/div>\n      \u003ch2>Where Our Paths First Crossed\u003c/h2>\n      \u003cp>Sometimes, the beginning is hidden inside an ordinary day.\u003c/p>\n    \u003c/div>\n\n    \u003carticle class=\"story-card\">\n      \u003cdiv class=\"story-copy\">\n        \u003cp>\n          Our story began in 2017 at St. Rita’s College of Balingasag,\n          when I arrived as a transferee student from USTP. We became\n          schoolmates and, unexpectedly, classmates in one subject—Filipino III.\n          At that time, however, we were both already in relationships,\n          and neither of us could have imagined that our paths would\n          one day lead us here.\n        \u003c/p>\n      \u003c/div>\n    \u003c/article>\n  \u003c/section>\n\n  \u003c!-- MEMORIES 1–10 -->\n  \u003csection class=\"section\" aria-label=\"Our first collection of memories\">\n    \u003cdiv class=\"photo-gallery\">\n      \u003cdiv class=\"polaroid\">\u003cdiv class=\"polaroid-photo\">\u003cimg src=\"./OUR%20STORY%20PICS/story%201.jpg\" alt=\"Our memory 1\" loading=\"lazy\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"polaroid\">\u003cdiv class=\"polaroid-photo\">\u003cimg src=\"./OUR%20STORY%20PICS/story%202.jpg\" alt=\"Our memory 2\" loading=\"lazy\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"polaroid\">\u003cdiv class=\"polaroid-photo\">\u003cimg src=\"./OUR%20STORY%20PICS/story%203.jpg\" alt=\"Our memory 3\" loading=\"lazy\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"polaroid\">\u003cdiv class=\"polaroid-photo\">\u003cimg src=\"./OUR%20STORY%20PICS/story%204.jpg\" alt=\"Our memory 4\" loading=\"lazy\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"polaroid\">\u003cdiv class=\"polaroid-photo\">\u003cimg src=\"./OUR%20STORY%20PICS/story%205.jpg\" alt=\"Our memory 5\" loading=\"lazy\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"polaroid\">\u003cdiv class=\"polaroid-photo\">\u003cimg src=\"./OUR%20STORY%20PICS/story%206.jpg\" alt=\"Our memory 6\" loading=\"lazy\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"polaroid\">\u003cdiv class=\"polaroid-photo\">\u003cimg src=\"./OUR%20STORY%20PICS/story%207.jpg\" alt=\"Our memory 7\" loading=\"lazy\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"polaroid\">\u003cdiv class=\"polaroid-photo\">\u003cimg src=\"./OUR%20STORY%20PICS/story%208.jpg\" alt=\"Our memory 8\" loading=\"lazy\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"polaroid\">\u003cdiv class=\"polaroid-photo\">\u003cimg src=\"./OUR%20STORY%20PICS/story%209.jpg\" alt=\"Our memory 9\" loading=\"lazy\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"polaroid\">\u003cdiv class=\"polaroid-photo\">\u003cimg src=\"./OUR%20STORY%20PICS/story%2010.jpg\" alt=\"Our memory 10\" loading=\"lazy\">\u003c/div>\u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"section\">\n    \u003cdiv class=\"section-heading\">\n      \u003cdiv class=\"eyebrow\">Chapter Two\u003c/div>\n      \u003ch2>Separate Paths, One Beautiful Plan\u003c/h2>\n      \u003cp>Even when life takes us in different directions, God never loses sight of the way.\u003c/p>\n    \u003c/div>\n\n    \u003carticle class=\"story-card\">\n      \u003cdiv class=\"story-copy\">\n        \u003cp>\n          Years passed, and life took us in different directions. By 2024,\n          we had both become professionals, each faithfully pursuing a\n          different calling. You became a police officer, dedicating\n          yourself to protecting and serving the community. I was still\n          serving in DepEd while continuing to pursue my application to\n          transfer to the Bureau of Fire Protection. We were building\n          our own lives, unaware that God was quietly preparing our\n          paths to meet again.\n        \u003c/p>\n      \u003c/div>\n    \u003c/article>\n  \u003c/section>\n\n  \u003c!-- MEMORIES 11–20 -->\n  \u003csection class=\"section\" aria-label=\"Our second collection of memories\">\n    \u003cdiv class=\"photo-gallery\">\n      \u003cdiv class=\"polaroid\">\u003cdiv class=\"polaroid-photo\">\u003cimg src=\"./OUR%20STORY%20PICS/story%2011.jpg\" alt=\"Our memory 11\" loading=\"lazy\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"polaroid\">\u003cdiv class=\"polaroid-photo\">\u003cimg src=\"./OUR%20STORY%20PICS/story%2012.jpg\" alt=\"Our memory 12\" loading=\"lazy\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"polaroid\">\u003cdiv class=\"polaroid-photo\">\u003cimg src=\"./OUR%20STORY%20PICS/story%2013.jpg\" alt=\"Our memory 13\" loading=\"lazy\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"polaroid\">\u003cdiv class=\"polaroid-photo\">\u003cimg src=\"./OUR%20STORY%20PICS/story%2014.jpg\" alt=\"Our memory 14\" loading=\"lazy\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"polaroid\">\u003cdiv class=\"polaroid-photo\">\u003cimg src=\"./OUR%20STORY%20PICS/story%2015.jpg\" alt=\"Our memory 15\" loading=\"lazy\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"polaroid\">\u003cdiv class=\"polaroid-photo\">\u003cimg src=\"./OUR%20STORY%20PICS/story%2016.jpg\" alt=\"Our memory 16\" loading=\"lazy\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"polaroid\">\u003cdiv class=\"polaroid-photo\">\u003cimg src=\"./OUR%20STORY%20PICS/story%2017.jpg\" alt=\"Our memory 17\" loading=\"lazy\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"polaroid\">\u003cdiv class=\"polaroid-photo\">\u003cimg src=\"./OUR%20STORY%20PICS/story%2018.jpg\" alt=\"Our memory 18\" loading=\"lazy\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"polaroid\">\u003cdiv class=\"polaroid-photo\">\u003cimg src=\"./OUR%20STORY%20PICS/story%2019.jpg\" alt=\"Our memory 19\" loading=\"lazy\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"polaroid\">\u003cdiv class=\"polaroid-photo\">\u003cimg src=\"./OUR%20STORY%20PICS/story%2020.jpg\" alt=\"Our memory 20\" loading=\"lazy\">\u003c/div>\u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"verse\">\n    “He has made everything beautiful in its time.”\n    \u003cspan>ECCLESIASTES 3:11\u003c/span>\n  \u003c/section>\n\n  \u003csection class=\"section\">\n    \u003cdiv class=\"section-heading\">\n      \u003cdiv class=\"eyebrow\">A Love Guided by Faith\u003c/div>\n      \u003ch2>More Than Coincidence\u003c/h2>\n    \u003c/div>\n\n    \u003carticle class=\"story-card\">\n      \u003cdiv class=\"story-copy\">\n        \u003cp>\n          Looking back, we now understand that our meeting was never\n          simply a matter of luck or coincidence. When the Lord prepared\n          both of our hearts, He was writing a divine design—one that\n          we could not yet see, but that He had already planned.\n        \u003c/p>\n\n        \u003cp>\n          What seemed like an unexpected encounter in college became\n          something far greater: a second chapter, a love story, and\n          a future we now pray will last in accordance with God’s will.\n          Some moments in life seem ordinary when they happen, only\n          to reveal their purpose much later.\n        \u003c/p>\n\n        \u003cp>\n          And perhaps that is the beauty of God’s timing. He allowed\n          our paths to cross before we were ready, then brought us\n          together again when our hearts and lives were prepared.\n          What began as an unexpected connection in college has become\n          a love we choose, a future we look forward to, and a journey\n          we entrust completely to Him.\n        \u003c/p>\n\n        \u003cp>\n          Our story is not about perfect timing—it is about divine timing.\n          And after all the years, changes, and seasons that brought us\n          here, we are grateful that God led us back to each other,\n          exactly when He knew we were ready.\n        \u003c/p>\n      \u003c/div>\n    \u003c/article>\n  \u003c/section>\n\n  \u003cfooter class=\"closing\">\n    \u003cimg class=\"rose-divider large\" src=\"./rose.png\" alt=\"\">\n    \u003ch2 class=\"script-heading\">And So, Our Forever Begins\u003c/h2>\n\n    \u003cp>\n      As we begin this new chapter, we pray that our marriage will\n      always be rooted in faith, strengthened by love, and guided\n      by the One who brought our paths together.\n    \u003c/p>\n\n    \u003c!-- CORRECT DESTINATION HERE TOO -->\n    \u003cdiv class=\"bottom-navigation\">\n      \u003ca class=\"nav-button primary\" href=\"inside.html\">\n        ← Back to Invitation\n      \u003c/a>\n      \u003ca class=\"nav-button\" href=\"details.html\">\n        View The Details →\n      \u003c/a>\n    \u003c/div>\n\n    \u003cdiv class=\"footer\">Made with love · December 28, 2026\u003c/div>\n  \u003c/footer>\n\n\u003c/main>\n\n\u003cscript>\n(function () {\n  const knownPages = {\n    \"index.html\": \"opening\",\n    \"inside.html\": \"invitation\",\n    \"details.html\": \"details\",\n    \"story.html\": \"story\",\n    \"prenup.html\": \"prenup\",\n    \"prenup(1).html\": \"prenup\"\n  };\n  document.addEventListener(\"click\", function (event) {\n    const link = event.target.closest(\"a[href]\");\n    if (!link) return;\n    con ble{outline:3px solid #789bb5;outline-offset:3px}\n.photo-card:hover{box-shadow:0 10px 26px rgba(67,87,103,.16)}\n.photo-missing{height:240px;display:grid;place-items:center;padding:.6rem;background:#edf4f8;color:#6f8fa7;font-size:.65rem;text-align:center}\n.closing{text-align:center;padding:3rem 1rem;background:linear-gradient(135deg,rgba(220,235,245,.52),rgba(255,253,248,.7),rgba(220,235,245,.5));border-top:1px solid var(--line)}\n.closing h2{margin:.6rem 0;color:#6e94b1;font-size:clamp(2.7rem,7vw,4.6rem)}\n.closing p{color:var(--muted);font-size:.76rem}\nfooter{padding:1.1rem;text-align:center;background:rgba(255,253,248,.72);color:#718697;font-size:.62rem;letter-spacing:.1em}\n.lightbox{display:none;position:fixed;inset:0;z-index:100;place-items:center;padding:1rem;background:rgba(27,38,48,.94)}\n.lightbox.open{display:grid}\n.lightbox img{display:block;max-width:92vw;max-height:86vh;width:auto;height:auto;object-fit:contain}\n.lightbox button{position:absolute;display:grid;place-items:center;width:44px;height:44px;border:1px solid rgba(255,255,255,.42);border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:1.55rem;cursor:pointer}\n.lightbox-close{top:1rem;right:1rem}.lightbox-prev{left:1rem;top:50%;transform:translateY(-50%)}.lightbox-next{right:1rem;top:50%;transform:translateY(-50%)}\n@media(max-width:650px){\n  body{background-attachment:scroll;background-size:100% auto;background-repeat:repeat-y}\n  .hero{min-height:38vh;padding:2.8rem .8rem}\n  .gallery-section{padding:2.5rem .45rem 3rem}\n  .gallery{gap:.4rem}\n  .photo-card{padding:5px 5px 22px;border-radius:5px}\n  .photo-card img{height:auto;max-height:360px;object-fit:contain}\n  .section-heading{margin-bottom:1.5rem}\n}\n/* Keep the page's ivory base visible if the decorative image cannot be found. */\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader class=\"hero\">\n  \u003cdiv class=\"hero-inner\">\n    \u003cdiv class=\"eyebrow\">Our Prenup Collection\u003c/div>\n    \u003ch1>Jelai \u003cspan>&amp;\u003c/span> Jhun\u003c/h1>\n    \u003cp>A romantic collection celebrating our journey toward forever.\u003c/p>\n    \u003cdiv class=\"date\">DECEMBER 28, 2026\u003c/div>\u003cbr>\n    \u003ca class=\"back-link\" href=\"inside.html#clickable-area\">← BACK\u003c/a>\n  \u003c/div>\n\u003c/header>\n\u003cmain>\n  \u003csection class=\"gallery-section\" id=\"gallery\">\n    \u003cdiv class=\"section-heading\">\n      \u003cdiv class=\"eyebrow\">Jelai &amp; Jhun · Prenup\u003c/div>\n      \u003ch2>A little gallery\u003cbr>of forever\u003c/h2>\n      \u003cdiv class=\"ornament\" aria-hidden=\"true\">❦\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"gallery\" id=\"photoGallery\" aria-label=\"Jelai and Jhun prenup gallery\">\u003c/div>\n  \u003c/section>\n  \u003csection class=\"closing\">\n    \u003cdiv class=\"eyebrow\">Two hearts, one beautiful story\u003c/div>\n    \u003ch2>Forever begins with us\u003c/h2>\n    \u003cp>Jelai &amp; Jhun · December 28, 2026\u003c/p>\n    \u003ca class=\"back-link\" href=\"inside.html#clickable-area\">← BACK\u003c/a>\n  \u003c/section>\n\u003c/main>\n\u003cfooter>MADE WITH LOVE FOR JELAI &amp; JHUN\u003c/footer>\n\u003cdiv class=\"lightbox\" id=\"lightbox\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Expanded prenup photograph\">\n  \u003cbutton class=\"lightbox-close\" id=\"closeLightbox\" aria-label=\"Close photo\">×\u003c/button>\n  \u003cbutton class=\"lightbox-prev\" id=\"prevPhoto\" aria-label=\"Previous photo\">‹\u003c/button>\n  \u003cimg id=\"lightboxImage\" src=\"\" alt=\"Expanded prenup photograph\">\n  \u003cbutton class=\"lightbox-next\" id=\"nextPhoto\" aria-label=\"Next photo\">›\u003c/button>\n\u003c/div>\n\u003cscript>\n/* Shows prenup 1.jpg through prenup 99.jpg. prenup 100.jpg and k.jpg are excluded. */\nconst photoPaths = [\n  \"PRENUP/prenup%201.jpg\",\n  \"PRENUP/prenup%202.jpg\",\n  \"PRENUP/prenup%203.jpg\",\n  \"PRENUP/prenup%204.jpg\",\n  \"PRENUP/prenup%205.jpg\",\n  \"PRENUP/prenu htbox.classList.add(\"open\");\n  document.body.style.overflow=\"hidden\";\n}\nfunction closePhoto(){\n  lightbox.classList.remove(\"open\");\n  lightboxImage.removeAttribute(\"src\");\n  document.body.style.overflow=\"\";\n}\nfunction movePhoto(direction){\n  activeIndex=(activeIndex+direction+photoPaths.length)%photoPaths.length;\n  openPhoto(activeIndex);\n}\ndocument.getElementById(\"closeLightbox\").addEventListener(\"click\",closePhoto);\ndocument.getElementById(\"prevPhoto\").addEventListener(\"click\",()=>movePhoto(-1));\ndocument.getElementById(\"nextPhoto\").addEventListener(\"click\",()=>movePhoto(1));\nlightbox.addEventListener(\"click\",event=>{if(event.target===lightbox)closePhoto()});\ndocument.addEventListener(\"keydown\",event=>{\n  if(!lightbox.classList.contains(\"open\"))return;\n  if(event.key===\"Escape\")closePhoto();\n  if(event.key===\"ArrowLeft\")movePhoto(-1);\n  if(event.key===\"ArrowRight\")movePhoto(1);\n});\n\u003c/script>\n\n\u003cscript>\n(function () {\n  const knownPages = {\n    \"index.html\": \"opening\",\n    \"inside.html\": \"invitation\",\n    \"details.html\": \"details\",\n    \"story.html\": \"story\",\n    \"prenup.html\": \"prenup\",\n    \"prenup(1).html\": \"prenup\"\n  };\n  document.addEventListener(\"click\", function (event) {\n    const link = event.target.closest(\"a[href]\");\n    if (!link) return;\n    const rawHref = link.getAttribute(\"href\") || \"\";\n    const fileName = rawHref.split(/[?#]/)[0].split(\"/\").pop();\n    if (knownPages[fileName]) {\n      event.preventDefault();\n      parent.postMessage({ type: \"wedding-page-navigation\", page: knownPages[fileName] }, \"*\");\n    }\n  }, true);\n})();\n\u003c/script>\n\n\u003c/body>\n\u003c/html>\n"};
const weddingFrame = document.getElementById("weddingPage");
function showWeddingPage(pageName) {
  if (!Object.prototype.hasOwnProperty.call(weddingPages, pageName)) return;
  weddingFrame.srcdoc = weddingPages[pageName];
  window.location.hash = pageName;
}
window.addEventListener("message", function (event) {
  if (event.data && event.data.type === "wedding-page-navigation") {
    showWeddingPage(event.data.page);
  }
});
const initialPage = window.location.hash.replace("#", "");
showWeddingPage(Object.prototype.hasOwnProperty.call(weddingPages, initialPage) ? initialPage : "opening");
